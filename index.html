<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>もかの家計簿</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#453d4b;background:#faf7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:18px}h1{font-size:23px}h2{font-size:18px;margin:24px 0 10px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:white;border:1px solid #eee2ef;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #72547c0a}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f5edf7;border-radius:12px;padding:12px}.stat small{display:block;color:#756b79}.stat strong{font-size:20px;overflow-wrap:anywhere}input,select,button{font:inherit;border:1px solid #ddd0e0;border-radius:8px;padding:9px;background:white;max-width:100%}input[type=number]{width:115px}input[type=date]{width:145px}input[type=time]{width:100px}input[type=checkbox]{width:18px;height:18px;accent-color:#9b70a8}button{cursor:pointer}button.primary{background:#9268a3;color:white;border:0}.scroll{overflow-x:auto}table{border-collapse:collapse;min-width:790px;width:100%}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}th{font-size:12px;color:#736778}td input[type=text]{width:110px}td input[type=number]{width:115px}td input[type=date]{width:145px}td input[type=time]{width:100px}td select{width:80px}.danger{color:#b05271}.hint{font-size:12px;color:#776c7b}.meter{background:#eee4f0;border-radius:9px;height:12px;overflow:hidden}.fill{background:#ab7abb;height:100%;width:0}footer{margin:28px 0;font-size:12px;color:#756b79}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal-head{text-align:center;font-size:12px;color:#756b79;padding:5px 0}.cal-day{min-height:76px;background:#faf6fb;border:1px solid #eee2ef;border-radius:8px;padding:5px;overflow:hidden}.cal-day.empty{background:transparent;border:0}.cal-date{font-size:12px;font-weight:700}.cal-money{font-size:10px;overflow-wrap:anywhere;line-height:1.4}.income{color:#26815a}.outgo{color:#b05271}.cal-summary{font-size:12px;color:#756b79;margin-bottom:10px}@media(max-width:520px){.cal-day{min-height:65px;padding:3px}.cal-money{font-size:9px}.cal-date{font-size:11px}} </style></head><body><main><h1>🦋 もかの家計簿</h1><div class="bar"><label>対象月 <input id="month" type="month"></label><button id="export">バックアップ保存</button><label><button id="importBtn">バックアップ読込</button><input id="import" type="file" accept="application/json" hidden></label></div><section class="card"><label>月間売上目標 ¥ <input id="goal" type="number" min="0" step="1000"></label><div class="stats" id="stats" style="margin-top:12px"></div><div class="meter"><div class="fill" id="fill"></div></div></section><section class="card"><h2>📅 収入・支出カレンダー</h2><p class="cal-summary">緑：売上実績 ／ ピンク：確定支出（日付ごとに合算）</p><div id="calendar" class="calendar-grid"></div></section><section class="card"><h2>出勤・売上</h2><p class="hint">出勤日に目標額を自動入力します。手動変更した目標は固定され、月目標や出勤日数を変更しても消えません。複数行が同じ日付なら1日として数えます。</p><div class="scroll"><table><thead><tr><th>日付</th><th>出勤</th><th>開始</th><th>終了</th><th>場所</th><th>目標 ¥</th><th>実績 ¥</th><th></th></tr></thead><tbody id="work"></tbody><tfoot><tr><th colspan="5">合計</th><th id="workTarget"></th><th id="workActual"></th><th></th></tr></tfoot></table></div><button class="primary" id="addWork">＋ 出勤行を追加</button></section><section class="card"><h2>出費・予定</h2><div class="scroll"><table><thead><tr><th>日付</th><th>内容</th><th>予定額 ¥</th><th>確定額 ¥</th><th>d払い</th><th>支払済</th><th></th></tr></thead><tbody id="expenses"></tbody><tfoot><tr><th colspan="2">合計</th><th id="expensePlan"></th><th id="expenseActual"></th><th colspan="3"></th></tr></tfoot></table></div><button class="primary" id="addExpense">＋ 出費行を追加</button></section><footer>データはこのブラウザ内に保存されます。別端末への移行やブラウザデータ削除に備えてバックアップを保存してください。公開URLを知る人でも、あなたの端末に保存された記録は見えません。</footer></main><script>
const $=id=>document.getElementById(id),yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'),num=x=>Number(x)||0;const KEY='moka-budget-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};let month=new Date().toISOString().slice(0,7);$('month').value=month;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const entry=()=>data[month]??(data[month]={goal:500000,work:[],expenses:[]});const dayCount=arr=>new Set(arr.filter(x=>x.attend&&x.date).map(x=>x.date)).size;function syncTargets(){const d=entry(),days=dayCount(d.work),auto=days?Math.ceil(num(d.goal)/days):0;for(const x of d.work){if(x.targetManual===undefined){x.targetManual=x.target!==undefined&&x.target!==null&&String(x.target)!=="";}if(!x.targetManual){x.target=x.attend&&x.date?String(auto):"";}}}
function stats(){let d=entry(),goal=num(d.goal),actual=d.work.reduce((s,x)=>s+num(x.actual),0),planned=d.work.reduce((s,x)=>s+num(x.target),0),days=dayCount(d.work),today=new Date().toISOString().slice(0,10),remainingDays=new Set(d.work.filter(x=>x.attend&&x.date>=today).map(x=>x.date)).size,remaining=Math.max(0,goal-actual),expensePlan=d.expenses.reduce((s,x)=>s+num(x.plan),0),expenseActual=d.expenses.reduce((s,x)=>s+num(x.actual),0);$('stats').innerHTML=[['売上目標',yen(goal)],['出勤予定日数',days+'日'],['1日あたり目標',days?yen(Math.ceil(goal/days)):'—'],['売上実績',yen(actual)],['目標まで残り',yen(remaining)],['残り出勤日あたり必要',remainingDays?yen(Math.ceil(remaining/remainingDays)):'—'],['出費予定',yen(expensePlan)],['確定出費',yen(expenseActual)],['売上 − 確定出費',yen(actual-expenseActual)]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('');$('fill').style.width=Math.min(100,goal?actual/goal*100:0)+'%';$('workTarget').textContent=yen(planned);$('workActual').textContent=yen(actual);$('expensePlan').textContent=yen(expensePlan);$('expenseActual').textContent=yen(expenseActual)}function sortRows(kind){entry()[kind].sort((a,b)=>(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'))}function renderCalendar(){const grid=$('calendar');grid.replaceChildren();const [year,mon]=month.split('-').map(Number);if(!year||!mon)return;const totals={};for(const x of entry().work){if(x.date&&x.date.startsWith(month)){(totals[x.date]??={income:0,expense:0}).income+=num(x.actual)}}for(const x of entry().expenses){if(x.date&&x.date.startsWith(month)){(totals[x.date]??={income:0,expense:0}).expense+=num(x.actual)}}for(const name of ['日','月','火','水','木','金','土']){let el=document.createElement('div');el.className='cal-head';el.textContent=name;grid.append(el)}const offset=new Date(year,mon-1,1).getDay(),last=new Date(year,mon,0).getDate();for(let i=0;i<offset;i++){const el=document.createElement('div');el.className='cal-day empty';grid.append(el)}for(let day=1;day<=last;day++){const date=month+'-'+String(day).padStart(2,'0'),v=totals[date]||{},el=document.createElement('div');el.className='cal-day';const label=document.createElement('div');label.className='cal-date';label.textContent=day;el.append(label);for(const [key,cls,prefix] of [['income','income','+'],['expense','outgo','−']]){if(v[key]){const line=document.createElement('div');line.className='cal-money '+cls;line.textContent=prefix+Math.round(v[key]).toLocaleString('ja-JP');el.append(line)}}grid.append(el)}}function renderTable(kind){let arr=entry()[kind],body=$(kind==='work'?'work':'expenses');body.replaceChildren();arr.forEach((obj,i)=>{let tr=document.createElement('tr');let fields=kind==='work'?[['date','date'],['attend','checkbox'],['start','time'],['end','time'],['place','text'],['target','number'],['actual','number']]:[['date','date'],['detail','text'],['plan','number'],['actual','number'],['dpay','checkbox'],['paid','checkbox']];fields.forEach(([key,type])=>{let td=document.createElement('td'),input=document.createElement('input');input.type=type;if(type==='checkbox')input.checked=!!obj[key];else input.value=obj[key]??'';if(type==='number'){input.min='0';input.step='1'}if(kind==='work'&&key==='target'){input.title=obj.targetManual?'手動目標（固定）':'自動目標';input.style.background=obj.targetManual?'#fff4df':'#f3ecf8'}input.addEventListener('input',()=>{obj[key]=type==='checkbox'?input.checked:input.value;if(kind==='work'&&key==='target')obj.targetManual=true;save();stats();renderCalendar()});input.addEventListener('change',()=>{obj[key]=type==='checkbox'?input.checked:input.value;save();if(key==='date'||(kind==='work'&&(key==='attend'||key==='target'))){sortRows(kind);syncTargets();save();render()}else{stats();renderCalendar()}});td.append(input);tr.append(td)});let td=document.createElement('td'),btn=document.createElement('button');btn.textContent='削除';btn.className='danger';btn.onclick=()=>{if(confirm('この行を削除しますか？')){arr.splice(i,1);syncTargets();save();render()}};td.append(btn);tr.append(td);body.append(tr)})}function render(){syncTargets();sortRows('work');sortRows('expenses');let d=entry();$('goal').value=d.goal;renderTable('work');renderTable('expenses');stats();renderCalendar()}$('month').onchange=e=>{month=e.target.value;render()};$('goal').oninput=e=>{entry().goal=e.target.value;syncTargets();save();renderTable('work');stats()};$('addWork').onclick=()=>{entry().work.push({date:month+'-01',attend:true,start:'15:00',end:'03:00',place:'',target:'',targetManual:false,actual:''});syncTargets();save();render()};$('addExpense').onclick=()=>{entry().expenses.push({date:month+'-01',detail:'',plan:'',actual:'',dpay:false,paid:false});save();render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moka-kakeibo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error();if(confirm('現在の記録をバックアップの内容で置き換えますか？')){data=incoming;save();render()}}catch{alert('バックアップファイルを読み込めませんでした')}e.target.value=''};render();
</script></body></html>
